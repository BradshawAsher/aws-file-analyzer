name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: .NET regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore backend.Tests/OpenAiChat.Tests.csproj
      - run: dotnet test backend.Tests/OpenAiChat.Tests.csproj --configuration Release --no-restore --verbosity normal

  frontend-tests:
    name: React regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://app-afa-eycaz6z3q3pp4.azurewebsites.net

  live-smoke:
    name: Deployed public smoke tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node e2e/smoke-test.mjs
        env:
          FRONTEND_URL: https://aws-file-analyzer.pages.dev
          BACKEND_URL: https://app-afa-eycaz6z3q3pp4.azurewebsites.net
          SMOKE_TEST_USERNAME: ${{ secrets.SMOKE_TEST_USERNAME }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          RUN_AI_SMOKE: ${{ secrets.RUN_AI_SMOKE }}
