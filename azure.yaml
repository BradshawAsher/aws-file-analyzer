# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: aws-file-analyzer
metadata:
  template: aws-file-analyzer@0.1.0

infra:
  provider: bicep
  path: infra
  module: main

services:
  api:
    project: ./backend
    language: csharp
    host: appservice

hooks:
  postprovision:
    posix:
      shell: sh
      run: ./scripts/grant-sql-access.sh
    windows:
      shell: pwsh
      run: ./scripts/grant-sql-access.ps1
